
name: Build My Savings APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q My_Savings_Android_Project.zip -d buildsrc

      - name: Build APK
        run: gradle -p buildsrc assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: My-Savings-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
